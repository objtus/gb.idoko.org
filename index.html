<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>guestbook - 100%health</title>
  <link rel="alternate" type="application/rss+xml" title="guestbook RSS" href="https://gb.idoko.org/api/guestbook-rss">
  <link rel="stylesheet" href="styles.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>
  <div id="wrapper">
    <header id="header">
      <div id="header-flex">
        <nav id="address" aria-label="パンくずナビゲーション">
          <ol class="breadcrumb">
            <li><a class="addressbar" href="https://yuinoid.neocities.org/">100%health</a></li>
            <li aria-current="page"><a class="addressbar" href="https://gb.idoko.org/">guestbook</a></li>
          </ol>
        </nav>
      </div>
    </header>

    <main id="main">
      <h1 class="title">guestbook</h1>

      <p id="poster-filter-banner" role="status"></p>

      <section id="post-form">
        <h2>書き込む</h2>
        <input type="hidden" id="input-reply-to" value="">

        <div id="fields-panel">
          <div class="form-row visually-hidden" aria-hidden="true">
            <label for="input-website">website</label>
            <input type="text" id="input-website" name="website" tabindex="-1" autocomplete="off">
          </div>
          <div class="form-row">
            <label for="input-name">name</label>
            <input type="text" id="input-name" maxlength="50" placeholder="Anonymous" autocomplete="off">
          </div>
          <div class="form-row">
            <label for="input-subject">subject</label>
            <input type="text" id="input-subject" maxlength="120" placeholder="(no subject)" autocomplete="off">
          </div>
          <div class="form-row">
            <label for="input-message">message</label>
            <textarea id="input-message" maxlength="1000" placeholder="message..."></textarea>
            <div class="form-row-meta" aria-label="現在時刻と文字数">
              <time id="form-compose-time" class="form-compose-time time-toggle" role="button" tabindex="0" datetime=""></time>
              <div class="char-count" id="char-count">0 chars / 0 bytes · max 1000 chars</div>
            </div>
          </div>
        </div>

        <div id="preview-panel" aria-live="polite"></div>

        <div class="cf-turnstile" data-sitekey="0x4AAAAAADIZD04CPzXtviYs" data-theme="light"></div>

        <div class="form-actions">
          <button type="button" class="btn" id="clear-btn">クリア</button>
          <button type="button" class="btn" id="preview-btn">プレビュー</button>
          <button type="button" class="btn" id="edit-btn" style="display:none">修正する</button>
          <button type="button" class="btn btn-primary" id="submit-btn" style="display:none">この内容で送信</button>
        </div>
        <div id="form-status"></div>
      </section>

      <section id="comments-section">
        <h2>messages</h2>
        <div id="loading">loading...</div>
        <div id="no-comments">まだコメントはありません。</div>
        <div id="comments-list"></div>
        <nav id="comments-pagination" class="comments-pagination" aria-label="ページ送り" hidden></nav>
      </section>
    </main>

    <footer id="main-footer">
      <ul class="footer-links">
        <li><a href="https://yuinoid.neocities.org/">100%health</a></li>
        <li><a href="https://idoko.org/">idoko.org</a></li>
        <li><a class="feed-link" href="https://gb.idoko.org/api/guestbook-rss">RSS</a></li>
      </ul>
    </footer>
  </div>

  <script>
    const API = '/api/comments';
    const MESSAGE_MAX = 1000;
    const MESSAGE_WARN_THRESHOLD = 900;
    let globalMaxId = 0;
    let posterFilter = '';
    let listPage = 1;
    let listLimit = null;

    function normalizePayload(raw) {
      if (Array.isArray(raw)) {
        const c = raw;
        return {
          comments: c,
          max_id: c.length ? Math.max(...c.map((x) => x.id)) : 0,
          page: 1,
          page_size: c.length,
          total_count: c.length,
          total_pages: 1,
          has_prev: false,
          has_next: false,
        };
      }
      const comments = raw.comments || [];
      return {
        comments,
        max_id: raw.max_id != null ? raw.max_id : 0,
        page: raw.page != null ? raw.page : 1,
        page_size: raw.page_size != null ? raw.page_size : 25,
        total_count: raw.total_count != null ? raw.total_count : comments.length,
        total_pages: raw.total_pages != null ? raw.total_pages : 1,
        has_prev: !!raw.has_prev,
        has_next: !!raw.has_next,
      };
    }

    function escHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escAttr(str) {
      return escHtml(str).replace(/'/g, '&#39;');
    }

    function displaySubjectRow(c) {
      return c.subject && String(c.subject).trim() ? String(c.subject).trim() : '(no subject)';
    }

    function formatLocalHuman(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      return d.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      });
    }

    const relativeTimeFmt = new Intl.RelativeTimeFormat('ja', { numeric: 'auto' });

    function formatRelativeJa(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      const diffSec = Math.round((d.getTime() - Date.now()) / 1000);
      const past = diffSec < 0;
      const s = Math.abs(diffSec);
      if (s < 45) return 'たった今';
      if (s < 3600) {
        const m = Math.max(1, Math.round(s / 60));
        return relativeTimeFmt.format(past ? -m : m, 'minute');
      }
      if (s < 86400) {
        const h = Math.max(1, Math.round(s / 3600));
        return relativeTimeFmt.format(past ? -h : h, 'hour');
      }
      if (s < 86400 * 7) {
        const days = Math.max(1, Math.round(s / 86400));
        return relativeTimeFmt.format(past ? -days : days, 'day');
      }
      if (s < 86400 * 30) {
        const w = Math.max(1, Math.round(s / (86400 * 7)));
        return relativeTimeFmt.format(past ? -w : w, 'week');
      }
      if (s < 86400 * 365) {
        const mo = Math.max(1, Math.round(s / (86400 * 30)));
        return relativeTimeFmt.format(past ? -mo : mo, 'month');
      }
      const y = Math.max(1, Math.round(s / (86400 * 365)));
      return relativeTimeFmt.format(past ? -y : y, 'year');
    }

    function toggleTimeDisplay(timeEl) {
      const iso = timeEl.getAttribute('datetime');
      if (!iso) return;
      if (timeEl.dataset.displayMode === 'relative') {
        timeEl.dataset.displayMode = 'absolute';
        timeEl.textContent = formatLocalHuman(iso);
        timeEl.title = 'クリックで相対表示に切替';
      } else {
        timeEl.dataset.displayMode = 'relative';
        timeEl.textContent = formatRelativeJa(iso);
        timeEl.title = 'クリックで日時表示に戻す';
      }
    }

    function isoDatetimeAttr(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      return d.toISOString();
    }

    function utf8Bytes(s) {
      return new TextEncoder().encode(s).length;
    }

    function charCountUnicode(s) {
      return [...String(s)].length;
    }

    function syncFormCharCount() {
      const el = document.getElementById('input-message');
      const cc = document.getElementById('char-count');
      if (!el || !cc) return;
      const v = el.value;
      const cu = charCountUnicode(v);
      cc.textContent = `${cu} chars / ${utf8Bytes(v)} bytes · max ${MESSAGE_MAX} chars`;
      cc.classList.toggle('warn', cu > MESSAGE_WARN_THRESHOLD);
    }

    function syncFormComposeTime() {
      const el = document.getElementById('form-compose-time');
      if (!el) return;
      const now = new Date();
      el.dateTime = now.toISOString();
      if (el.dataset.displayMode === 'relative') {
        el.textContent = formatRelativeJa(el.dateTime);
        el.title = 'クリックで日時表示に戻す';
      } else {
        el.textContent = formatLocalHuman(el.dateTime);
        el.title = 'クリックで相対表示に切替';
      }
    }

    function linkifyUrlsInEscaped(escaped) {
      const re = /https?:\/\/[^\s<]+/gi;
      return escaped.replace(re, (rawMatch) => {
        let u = rawMatch;
        let suffix = '';
        while (u.length && /[.,;:!?。、]+$/.test(u)) {
          suffix = u.slice(-1) + suffix;
          u = u.slice(0, -1);
        }
        const href = u.replace(/&amp;/g, '&');
        let parsed;
        try {
          parsed = new URL(href);
        } catch {
          return rawMatch;
        }
        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return rawMatch;
        const safeHref = escAttr(href);
        return `<a class="body-link" href="${safeHref}" rel="noopener noreferrer" target="_blank">${u}</a>${suffix}`;
      });
    }

    function linkifyRefsAfterEscape(escapedBody, maxId, permUrlForId) {
      return escapedBody.replace(/&gt;&gt;(\d+)/g, (_, digits) => {
        const n = parseInt(digits, 10);
        const stale = n > maxId;
        const cls = stale ? 'ref-link ref-link--stale' : 'ref-link';
        const href = escAttr(permUrlForId(n));
        return `<a class="${cls}" href="${href}">&gt;&gt;${digits}</a>`;
      });
    }

    function thankYouMessage() {
      const fmt = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo',
        hour: 'numeric',
        hour12: false,
      });
      const h = parseInt(fmt.formatToParts(new Date()).find((p) => p.type === 'hour').value, 10);
      if (h >= 5 && h < 12) return '朝の投稿、ありがとうございます。';
      if (h >= 12 && h < 18) return 'ありがとうございます。';
      if (h >= 18 && h < 22) return 'お疲れさまです。ありがとうございます。';
      return '遅い時間にもありがとうございます。';
    }

    function readQueryState() {
      const sp = new URLSearchParams(window.location.search);
      const p = parseInt(sp.get('page') || '1', 10);
      listPage = Number.isInteger(p) && p >= 1 ? p : 1;
      const limRaw = sp.get('limit');
      if (limRaw != null && String(limRaw).trim() !== '') {
        const lm = parseInt(limRaw, 10);
        listLimit = Number.isInteger(lm) && lm >= 1 && lm <= 100 ? lm : null;
      } else {
        listLimit = null;
      }
      const qPoster = sp.get('poster');
      posterFilter = qPoster && qPoster.trim() ? qPoster.trim() : '';
      const banner = document.getElementById('poster-filter-banner');
      if (!posterFilter) {
        banner.style.display = 'none';
        banner.textContent = '';
        return;
      }
      banner.style.display = 'block';
      banner.innerHTML = `${escHtml(posterFilter)} の投稿のみ表示中。<a href="${escAttr(window.location.pathname)}">全件を表示</a>`;
    }

    function buildListHref(page) {
      const base = window.location.pathname || '/';
      const p = new URLSearchParams();
      if (posterFilter) p.set('poster', posterFilter);
      if (listLimit != null) p.set('limit', String(listLimit));
      if (page > 1) p.set('page', String(page));
      const s = p.toString();
      return s ? `${base}?${s}` : base;
    }

    function buildPosterHref(posterId) {
      const base = window.location.pathname || '/';
      const p = new URLSearchParams();
      p.set('poster', posterId);
      if (listLimit != null) p.set('limit', String(listLimit));
      const s = p.toString();
      return `${base}?${s}`;
    }

    function renderPagination(meta) {
      const nav = document.getElementById('comments-pagination');
      if (!nav) return;
      if (meta.total_pages <= 1) {
        nav.hidden = true;
        nav.innerHTML = '';
        return;
      }
      nav.hidden = false;
      const prev = meta.has_prev
        ? `<a rel="prev" class="pagination-link" href="${escAttr(buildListHref(meta.page - 1))}">前のページ</a>`
        : '<span class="pagination-link pagination-link--disabled" aria-disabled="true">前のページ</span>';
      const next = meta.has_next
        ? `<a rel="next" class="pagination-link" href="${escAttr(buildListHref(meta.page + 1))}">次のページ</a>`
        : '<span class="pagination-link pagination-link--disabled" aria-disabled="true">次のページ</span>';
      nav.innerHTML = `<div class="pagination-row">${prev}<span class="pagination-meta">${meta.page} / ${meta.total_pages}</span>${next}</div>`;
    }

    function replyTargetIdsForList(c) {
      if (Array.isArray(c.reply_target_ids) && c.reply_target_ids.length > 0) {
        const seen = new Set();
        const out = [];
        for (const raw of c.reply_target_ids) {
          const n = Number(raw);
          if (!Number.isInteger(n) || n < 1 || seen.has(n)) continue;
          seen.add(n);
          out.push(n);
        }
        return out;
      }
      if (c.reply_to_id != null) {
        const n = Number(c.reply_to_id);
        if (Number.isInteger(n) && n > 0) return [n];
      }
      return [];
    }

    function renderList(comments, maxId) {
      const list = document.getElementById('comments-list');
      const origin = window.location.origin;
      const permUrl = (id) => `${origin}/guestbook/${String(id).padStart(3, '0')}`;
      let rows = comments;
      if (posterFilter) {
        rows = comments.filter((c) => String(c.poster_id || '') === posterFilter);
      }
      if (!rows.length) {
        list.innerHTML = '';
        return;
      }
      list.innerHTML = rows.map((c) => {
        const id = c.id;
        const subj = displaySubjectRow(c);
        const subjAttr = c.subject && String(c.subject).trim() ? String(c.subject).trim() : '(no subject)';
        const author = escHtml(c.display_name || ((c.name && String(c.name).trim()) ? c.name : 'Anonymous'));
        const star = c.is_admin ? ' ★' : '';
        const whenHuman = formatLocalHuman(c.created_at);
        const whenIso = isoDatetimeAttr(c.created_at);
        const pid = String(c.poster_id || '');
        const posterLink = pid
          ? `<a rel="tag" href="${escAttr(buildPosterHref(pid))}">${escHtml(pid)}</a>`
          : '—';
        const bodyRaw = String(c.message || '');
        const bodyHtml = linkifyRefsAfterEscape(linkifyUrlsInEscaped(escHtml(bodyRaw)), maxId, permUrl);
        const replyTo = replyTargetIdsForList(c)
          .map((tid) => `<a class="u-in-reply-to" href="${escAttr(permUrl(tid))}"></a>`)
          .join('');
        const idDisp = '#' + String(id).padStart(3, '0');
        return `
<article class="h-entry guestbook-entry" id="comment-${id}">
  <a class="u-uid" href="${escAttr(permUrl(id))}"></a>
  ${replyTo}
  <header>
    <div class="guestbook-head">
      <div class="guestbook-head-line">
        <a class="guestbook-head-id guestbook-head-permalink" href="${escAttr(permUrl(id))}" aria-label="${escAttr(`${idDisp} の個別ページ`)}">${escHtml(idDisp)}</a>
        <div class="guestbook-stats">
          <span class="guestbook-stats-meta">${charCountUnicode(bodyRaw)} chars / ${utf8Bytes(bodyRaw)} bytes</span>
          <span class="guestbook-stats-id">ID: ${posterLink}</span>
        </div>
      </div>
      <div class="guestbook-head-meta">
        <span class="guestbook-meta-k">From :</span><span class="guestbook-meta-v"><span class="p-author">${author}</span>${escHtml(star)}</span>
        <span class="guestbook-meta-k">Date :</span><span class="guestbook-meta-v"><time class="dt-published time-toggle" tabindex="0" role="button" title="クリックで相対表示に切替" datetime="${escAttr(whenIso)}">${escHtml(whenHuman)}</time></span>
        <span class="guestbook-meta-k">Subject :</span><span class="guestbook-meta-v">${escHtml(subj)}</span>
      </div>
    </div>
    <data class="p-name" value="${escAttr(subjAttr)}"></data>
  </header>
  <div class="e-content guestbook-body">${bodyHtml}</div>
  <div class="reply-row">
    <button type="button" class="btn reply-btn" data-reply-id="${id}" data-subject="${escAttr(subjAttr)}" aria-label="返信">↩</button>
  </div>
</article>`;
      }).join('');

      list.querySelectorAll('.reply-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const rid = btn.getAttribute('data-reply-id');
          const sub = btn.getAttribute('data-subject') || '(no subject)';
          document.getElementById('input-reply-to').value = rid;
          const reSub = sub.startsWith('re: ') ? sub : `re: ${sub}`;
          document.getElementById('input-subject').value = reSub;
          const msg = document.getElementById('input-message');
          const line = `>>${rid} `;
          msg.value = msg.value.trim().length ? `${line}\n${msg.value}` : `${line}\n`;
          document.getElementById('post-form').scrollIntoView({ behavior: 'smooth' });
          msg.focus();
          syncFormCharCount();
        });
      });
    }

    async function loadComments() {
      const loading = document.getElementById('loading');
      const list = document.getElementById('comments-list');
      const noComments = document.getElementById('no-comments');
      try {
        readQueryState();
        const params = new URLSearchParams();
        params.set('page', String(listPage));
        if (posterFilter) params.set('poster', posterFilter);
        if (listLimit != null) params.set('limit', String(listLimit));
        const res = await fetch(`${API}?${params}`);
        const raw = await res.json();
        if (!res.ok) {
          loading.textContent = raw.error || 'コメントの読み込みに失敗しました。';
          renderPagination({ total_pages: 1, has_prev: false, has_next: false, page: 1 });
          return;
        }
        const payload = normalizePayload(raw);
        const { comments: data, max_id: mid } = payload;
        globalMaxId = mid || 0;
        loading.style.display = 'none';
        renderPagination(payload);
        if (!data.length) {
          noComments.style.display = 'block';
          noComments.textContent = posterFilter
            ? 'この ID の投稿はまだありません。'
            : 'まだコメントはありません。';
          list.innerHTML = '';
          return;
        }
        noComments.textContent = 'まだコメントはありません。';
        renderList(data, globalMaxId);
        noComments.style.display = 'none';
      } catch (e) {
        loading.textContent = 'コメントの読み込みに失敗しました。';
      }
    }

    const msgInput = document.getElementById('input-message');
    const previewPanel = document.getElementById('preview-panel');
    const fieldsPanel = document.getElementById('fields-panel');
    const previewBtn = document.getElementById('preview-btn');
    const editBtn = document.getElementById('edit-btn');
    const submitBtn = document.getElementById('submit-btn');
    const clearBtn = document.getElementById('clear-btn');

    function setComposeMode(isPreview) {
      previewPanel.classList.toggle('is-visible', isPreview);
      previewPanel.style.display = isPreview ? 'block' : 'none';
      fieldsPanel.style.display = isPreview ? 'none' : '';
      previewBtn.style.display = isPreview ? 'none' : '';
      clearBtn.style.display = isPreview ? 'none' : '';
      editBtn.style.display = isPreview ? '' : 'none';
      submitBtn.style.display = isPreview ? '' : 'none';
    }

    function resetPreview() {
      setComposeMode(false);
      previewPanel.textContent = '';
    }

    msgInput.addEventListener('input', syncFormCharCount);

    clearBtn.addEventListener('click', () => {
      document.getElementById('input-name').value = '';
      document.getElementById('input-subject').value = '';
      document.getElementById('input-website').value = '';
      document.getElementById('input-reply-to').value = '';
      msgInput.value = '';
      syncFormCharCount();
      const st = document.getElementById('form-status');
      st.textContent = '';
      st.className = '';
      resetPreview();
      try { turnstile.reset(); } catch (e) {}
    });

    previewBtn.addEventListener('click', () => {
      const status = document.getElementById('form-status');
      const message = msgInput.value.trim();
      if (!message) {
        status.textContent = '本文を入力してください。';
        status.className = 'err';
        return;
      }
      status.textContent = '';
      status.className = '';
      const name = document.getElementById('input-name').value.trim() || 'Anonymous';
      const subject = document.getElementById('input-subject').value.trim() || '(no subject)';
      const replyTo = document.getElementById('input-reply-to').value.trim();
      const previewText = [
        `名前: ${name}`,
        `件名: ${subject}`,
        replyTo ? `返信先: #${replyTo}` : '',
        '',
        message,
        '',
        `${charCountUnicode(message)} chars / ${utf8Bytes(message)} bytes`,
      ].filter(Boolean).join('\n');
      previewPanel.textContent = previewText;
      setComposeMode(true);
    });

    editBtn.addEventListener('click', () => resetPreview());

    submitBtn.addEventListener('click', async () => {
      const name = document.getElementById('input-name').value.trim();
      const subject = document.getElementById('input-subject').value.trim();
      const message = msgInput.value.trim();
      const honeypot = document.getElementById('input-website').value;
      const replyTo = document.getElementById('input-reply-to').value.trim();
      const status = document.getElementById('form-status');
      const btn = submitBtn;

      if (!message) {
        status.textContent = '本文を入力してください。';
        status.className = 'err';
        return;
      }

      const tokenEl = document.querySelector('[name="cf-turnstile-response"]');
      const turnstileToken = tokenEl ? tokenEl.value : '';
      if (!turnstileToken) {
        status.textContent = 'Turnstileの確認が完了していません。';
        status.className = 'err';
        return;
      }

      btn.disabled = true;
      status.textContent = '送信中...';
      status.className = '';

      const payload = {
        name,
        subject,
        message,
        turnstileToken,
        website: honeypot,
      };
      if (replyTo) payload.reply_to_id = replyTo;

      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.ok) {
          status.textContent = thankYouMessage();
          status.className = 'ok';
          document.getElementById('input-name').value = '';
          document.getElementById('input-subject').value = '';
          document.getElementById('input-website').value = '';
          document.getElementById('input-reply-to').value = '';
          msgInput.value = '';
          syncFormCharCount();
          resetPreview();
          try { turnstile.reset(); } catch (e) {}
          await loadComments();
        } else {
          status.textContent = data.error || '送信に失敗しました。';
          status.className = 'err';
          try { turnstile.reset(); } catch (e) {}
        }
      } catch (e) {
        status.textContent = '送信に失敗しました。';
        status.className = 'err';
        try { turnstile.reset(); } catch (e) {}
      } finally {
        btn.disabled = false;
      }
    });

    const commentsListEl = document.getElementById('comments-list');
    commentsListEl.addEventListener('click', (e) => {
      const t = e.target.closest('time.dt-published.time-toggle');
      if (!t || !commentsListEl.contains(t)) return;
      toggleTimeDisplay(t);
    });

    const formComposeTimeEl = document.getElementById('form-compose-time');
    formComposeTimeEl.addEventListener('click', () => toggleTimeDisplay(formComposeTimeEl));

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const t = e.target.closest('time.time-toggle');
      if (!t) return;
      e.preventDefault();
      toggleTimeDisplay(t);
    });

    syncFormComposeTime();
    setInterval(syncFormComposeTime, 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncFormComposeTime();
    });

    loadComments();
  </script>
</body>
</html>
